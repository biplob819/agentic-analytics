name: pages

# REL-02, REL-05: build site/ in the workflow from the committed published-run record
# (docs/results/summary.json and run.json; OWNER D-111) and deploy it to GitHub Pages, the
# fallback host named in REL-02 (D-46). Nothing large is committed: the dashboard is rendered
# here with the bundled pack's credit and the stamped region, and has no per-answer records or
# traces. Run by hand only; it refuses an empty site and the SYNTHETIC example, and secret-scans
# the site before upload. Two jobs (D-114): `build` renders, checks and uploads with the
# repository's read-only token and no environment; `deploy` alone holds the Pages grants and
# runs only the pinned deploy action, with no checkout and no `run:` step.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: "3.12"
      - name: Render the dashboard from the committed record
        run: uv run --locked --no-dev python scripts/publish_results.py --from-record
      - name: Refuse an empty site or the synthetic example
        run: |
          [ -f site/index.html ] || { echo "site/index.html is missing" >&2; exit 1; }
          [ -f site/summary.json ] || { echo "site/summary.json is missing" >&2; exit 1; }
          if grep -q "SYNTHETIC EXAMPLE" site/index.html; then
            echo "site/ holds the synthetic example, not results" >&2
            exit 1
          fi
      - name: Secret-scan the site, traces included
        run: python3 scripts/secret_scan.py site
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write   # proves to Pages that this run may deploy; no stored token
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
