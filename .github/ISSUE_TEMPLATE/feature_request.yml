name: Feature, pack or question request
description: Suggest an improvement, a backend, a dataset pack or new questions
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to measure, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would help?
  - type: textarea
    id: dataset
    attributes:
      label: For a dataset pack, its licence, attribution and where it is published
