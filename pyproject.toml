[project]
name = "agentic-analytics"
version = "0.0.1"
description = "A benchmark harness for text-to-SQL agents: scores analytics agents against gold SQL over dataset packs, without an LLM judge, with a bundled UK house-price pack."
readme = { file = "README.md", content-type = "text/markdown" }
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Biplob Chakraborty" }]
keywords = [
    "text-to-sql",
    "benchmark",
    "evaluation",
    "llm",
    "agents",
    "analytics",
    "clickhouse",
    "snowflake",
    "mcp",
]
# No "License ::" classifier: `license = "MIT"` (PEP 639) supersedes it, and PyPI refuses an
# upload that carries both a License-Expression and a license classifier.
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6",
    "anthropic>=2.8",
    "openai>=3.51",
    # D-2, D-97: exact pin on the PyPI release (tag v0.3.0, commit 4ddfef5)
    "evalkit-harness==0.3.0",
    "mcp>=1.10",
    "sqlglot>=26",
    "clickhouse-connect>=0.8",
    "snowflake-connector-python>=3.12",
    "cryptography>=43",
    "pyjwt>=2.9",
    "httpx2>=2.16",
]

[project.optional-dependencies]
# D-57: the hosted demo (Streamlit Community Cloud installs demo/requirements.txt, pinned to
# these as locked in uv.lock; tests/demo/test_deploy.py keeps the two in step)
demo = [
    "psycopg[binary]>=3.3",
    "streamlit>=1.67",
]

[project.urls]
Homepage = "https://github.com/biplob819/agentic-analytics"
Repository = "https://github.com/biplob819/agentic-analytics"
Documentation = "https://github.com/biplob819/agentic-analytics/tree/main/docs"
Issues = "https://github.com/biplob819/agentic-analytics/issues"
Changelog = "https://github.com/biplob819/agentic-analytics/blob/main/changelog.md"

[project.scripts]
agentic-analytics = "agentic_analytics.cli:main"
aa = "agentic_analytics.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "hypothesis>=6",
    "ruff>=0.6",
    "pyright>=1.1.380",
    "types-pyyaml>=6.0.12.20261113",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_analytics"]

[tool.hatch.build.targets.sdist]
# build-harness and planning material stays in the repository, not the published sdist
exclude = [
    "/specs",
    "/site",
    "/results",
    "/docs/measurements",
    "/.harness",
    "/.github",
    "/Agentic Analytics PRD.md",
    "/Agentic Analytics Tech Spec.md",
    "/Portfolio notes.md",
    "/portfolio.yml",
    "/docs/assets/walkthrough.gif",
    # the build record and its tests stay in the repository: the tests read files excluded above
    "/tests",
    "/docs/decisions.md",
    "/docs/graph",
    "/docs/lessons.md",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "scripts", "tests"]
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # allow the › separator used in proof cells

[tool.pyright]
include = ["src", "scripts", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
extraPaths = ["scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
markers = [
    "contract: schema, CLI and EvalKit-import contract tests",
    "golden: end-to-end run against recorded responses",
    "gold: gold coverage, gold check, frozen fixes and leak check",
    "safety: secrets, SQL guard, allow-list and demo guard tests",
    "live: needs real accounts; never run in CI",
]
